name: Add Google Analytics

on:
  push:
    paths:
      - .github/workflows/add-google-analytics.yml

permissions:
  contents: write

jobs:
  add-analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add GA4 tag to site pages
        run: |
          python - <<'PY'
          from pathlib import Path

          measurement_id = "G-VG60LD71B9"
          snippet = f'''<!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id={measurement_id}"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){{dataLayer.push(arguments);}}
            gtag('js', new Date());
            gtag('config', '{measurement_id}');
          </script>
          '''

          for filename in ["index.html", "research-publications-media.html", "teaching.html"]:
              path = Path(filename)
              text = path.read_text()
              if measurement_id not in text:
                  text = text.replace("<head>\n", "<head>\n  " + snippet.replace("\n", "\n  "), 1)
                  path.write_text(text)
          PY
      - name: Commit analytics tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html research-publications-media.html teaching.html
          git commit -m "Add Google Analytics GA4 tag"
          git push
