name: Tune homepage tagline

on:
  push:
    paths:
      - .github/workflows/tune-tagline.yml

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adjust tagline hierarchy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/styles.css')
          s = p.read_text()
          old = """.identity-line em {\n  display: block;\n  margin-top: .34em;\n  font-size: .72em;\n  line-height: 1.35;\n  font-weight: 500;\n  letter-spacing: .01em;\n}"""
          new = """.identity-line em {\n  display: block;\n  margin-top: .48em;\n  padding-left: 16px;\n  border-left: 3px solid rgba(63,100,145,.32);\n  font-size: .92em;\n  line-height: 1.35;\n  font-weight: 500;\n  letter-spacing: .01em;\n}"""
          if old not in s:
              raise SystemExit('Expected tagline CSS not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/styles.css
          git commit -m "Refine homepage tagline styling"
          git push
